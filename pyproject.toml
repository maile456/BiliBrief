[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibrief"
version = "0.1.0"
description = "A fast Bilibili video digest MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.2.1,<1.3",
  # faster-whisper 1.2 uses av.open(..., metadata_errors="ignore").
  "av==16.1.0",
]
vision = [
  "pillow>=10.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
bilibrief = "vidbrief.server:main"
vidbrief = "vidbrief.server:main"

[tool.setuptools.packages.find]
where = ["src"]

