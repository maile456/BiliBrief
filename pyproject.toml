[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibrief"
version = "0.2.0"
description = "Read Bilibili subtitles as plain text over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2",
  "yt-dlp>=2025.1.15",
]

[project.scripts]
bilibrief = "vidbrief.server:main"
vidbrief = "vidbrief.server:main"

[tool.setuptools.packages.find]
where = ["src"]
